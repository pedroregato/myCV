    status: ativo
    visibilidade: privado
    inicio: "2026-04"
    tecnologias: [Python, fpdf2, PyYAML, Anthropic API, LangGraph]
    claude_code: true
    caminho_local: "D:/PythonProjects/myCV"
    descricao: >
      Plataforma pessoal para geração de CV em PDF (PT/EN), gestão do perfil LinkedIn,
      catálogo de projetos e assistente IA para atualização de conteúdo.
    impacto: "Automatiza e centraliza a gestão da presença profissional."
